services:
  - type: web
    name: vended-web
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/healthz
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: LOG_LEVEL
        value: info
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vended-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: vended-db
    plan: free
    databaseName: vended
    user: vended_user
    ipAllowList: []
